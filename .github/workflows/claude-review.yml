name: Claude review

# Review automático de PR com a assinatura do Claude (estilo Bugbot): procura
# bugs no diff e comenta no PR. Não faz push nem aprova.
# Não roda a cada push: cada review do Opus gasta o equivalente a 10–15 avaliações de vaga da cota
# do Pro (a mesma do worker da IA e do celular). Roda quando o PR abre, sai de rascunho ou reabre;
# para revisar de novo depois de um push, ponha o label `review` no PR (tire e ponha para repetir).
# PR que só mexe em markdown não roda.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Só PR de dentro do repositório e fora de rascunho. PR de fork não recebe
    # os secrets, então o job falharia de qualquer jeito.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      # A action usa OIDC para obter o token do app do Claude no GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O bot precisa ver o que já foi comentado e respondido nas threads inline
      # (`gh pr view --comments` só traz os comentários gerais): sem isso ele repete
      # achados e reabre o que o autor já corrigiu. Só leitura, fora do diff do PR.
      - name: Threads do PR para o review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review
          gh api graphql -F dono="${REPO%%/*}" -F nome="${REPO##*/}" -F pr="$PR" -f query='
            query($dono: String!, $nome: String!, $pr: Int!) {
              repository(owner: $dono, name: $nome) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved isOutdated path line
                      comments(first: 50) { nodes { author { login } createdAt body } }
                    }
                  }
                }
              }
            }' --jq '
            .data.repository.pullRequest.reviewThreads.nodes[]
            | "## \(.path):\(.line // "?") — \(if .isResolved then "RESOLVIDA" else "aberta" end)\(if .isOutdated then " (outdated)" else "" end)\n"
              + ([.comments.nodes[] | "- \(.author.login // "?") em \(.createdAt):\n\(.body | gsub("\n"; "\n  ") | "  " + .)"] | join("\n"))
              + "\n"' > .review/threads.md
          echo "threads: $(grep -c '^## ' .review/threads.md || true)"

      - uses: anthropics/claude-code-action@v1
        with:
          # Gerado com `claude setup-token`. Usa a cota do plano Pro.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você revisa este PR e só reporta BUG REAL.

            1. Contexto, antes de tudo: o diff (`gh pr diff`), os comentários gerais
               (`gh pr view --comments`), TODAS as threads inline com as respostas em
               `.review/threads.md` e o `CLAUDE.md` da raiz, se existir.
            2. Só o que quebra comportamento: resultado errado, exceção não tratada
               (500), perda ou corrupção de dado, concorrência, custo de provider pago
               sem teto, segurança, teste que passa sem a mudança que diz cobrir.
               PROIBIDO: estilo, nomes, documentação ou README, refatoração, "poderia",
               configuração hipotética que ninguém usa.
            3. Evidência obrigatória: `arquivo:linha`, a ENTRADA concreta que quebra e o
               resultado observado contra o esperado. Sem entrada concreta, não reporte.
               Antes de comentar, siga o caminho no código e confirme que nada trata o caso.
            4. Não repita: nada que já está em `.review/threads.md` (aberta ou RESOLVIDA),
               nos comentários gerais ou em "Não são bugs" do `CLAUDE.md` volta, nem com
               outras palavras. Thread resolvida com "Corrigido em …" está encerrada. Sobre
               uma correção já feita, só comente se ela QUEBROU algo, nunca porque deixou
               de cobrir mais uma variação rara do mesmo caso.
            5. Severidade no começo do comentário: [ALTA] perde dado, 500 em caminho comum,
               custo ou segurança; [MÉDIA] errado num caso plausível. Concorrência entre dois
               gatilhos que já existem (timer, botão, duas abas, reentrega), timeout, soma de
               tempos contra um limite, processo que sobra depois de kill, falha passageira de
               rede ou de provider: NÃO é caso raro, reporte. Só não reporte combinação de
               entrada que nenhum caminho do código produz.
            6. No máximo 5 achados por rodada, os mais graves. Um comentário inline por
               achado, em português, em até 8 linhas.
            7. Antes de concluir que não há bugs, liste para você mesmo os caminhos de erro,
               de tempo e de concorrência que o diff toca, e confira cada um.
            8. Se nada passar por esses filtros: um único comentário curto no PR, "Não
               encontrei bugs.", e mais nada.
          # Opus: o Sonnet errava demais nos achados (13/10, com este prompt, em 5 bugs reais
          # antigos: Sonnet 0 de 5, Opus 5 de 5). Gasta mais da cota do Pro,
          # a mesma das sessões do celular. As ferramentas ficam limitadas a ler
          # o PR e comentar; as threads inline chegam pelo arquivo do passo acima.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
