name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vagas
          POSTGRES_PASSWORD: vagas-ci
          POSTGRES_DB: vagas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vagas -d vagas_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do service container: a senha não é segredo.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: vagas
      PGPASSWORD: vagas-ci
      PGDATABASE: vagas_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  imagem:
    # Só depois dos testes, e só na main: o Pi puxa ghcr.io/beatriztw/vagas-svc:main.
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner arm64 do GitHub (grátis em repo público): a imagem sai nativa para o Orange Pi.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: imagem-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # :main é o que o Pi acompanha; :<sha> é para voltar a uma versão.
          tags: |
            ghcr.io/beatriztw/vagas-svc:main
            ghcr.io/beatriztw/vagas-svc:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
