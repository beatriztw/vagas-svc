<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"404","swap":true,"error":false},{"code":"409","swap":true,"error":false},{"code":"422","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}'>
<title>{% block titulo %}vagas-svc{% endblock %}</title>
<link rel="stylesheet" href="{{ "tela.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-ia.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-perfil.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-detalhe.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-curriculo.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-mobile.css"|estatico }}">
<link rel="stylesheet" href="{{ "tela-login.css"|estatico }}">
<script src="{{ "htmx.min.js"|estatico }}" defer></script>
<script src="{{ "tela.js"|estatico }}" defer></script>
<script src="{{ "tela-mobile.js"|estatico }}" defer></script>
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <div class="marca">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </span>
      <span class="marca-nome">vagas-svc</span>
    </div>
    {% if request.state.pessoa %}
    <div class="topo-acoes">
      <a class="botao" href="/tela/perfil">Meu perfil</a>
      <span class="topo-pessoa">{{ request.state.pessoa.nome_exibicao }}</span>
      <form class="form-sair" method="post" action="/logout">
        <button type="submit" class="botao">Sair</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>
{% block aviso %}<div id="aviso" class="erro" role="alert" hidden></div>{% endblock %}
<main class="pagina">
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
