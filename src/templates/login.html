{% extends "base.html" %}
{% block titulo %}Entrar - vagas-svc{% endblock %}
{% block aviso %}{% if mensagem %}<div id="aviso" class="erro" role="alert">{{ mensagem }}</div>{% else %}{{ super() }}{% endif %}{% endblock %}
{% block conteudo %}
<form class="login" method="post" action="/login">
  <h1>Entrar</h1>
  <div class="campo">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" value="{{ nome }}" maxlength="60" autocomplete="username" autofocus required>
  </div>
  <div class="campo">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" maxlength="1024" autocomplete="current-password" required>
  </div>
  <button type="submit" class="botao botao-primario">Entrar</button>
</form>
{% endblock %}
